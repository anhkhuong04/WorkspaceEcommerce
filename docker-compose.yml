name: workspace-ecommerce

services:
  api:
    build:
      context: .
      dockerfile: src/WorkspaceEcommerce.Api/Dockerfile
      target: final
    image: workspace-ecommerce-api:local
    container_name: workspace-ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/workspace-ecommerce-devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_HTTPS_CERT_PASSWORD:?Set ASPNETCORE_HTTPS_CERT_PASSWORD in .env}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AdminAuth__Email: ${AdminAuth__Email:?Set AdminAuth__Email in .env}
      AdminAuth__Password: ${AdminAuth__Password:?Set AdminAuth__Password in .env}
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer in .env}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience in .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
      DataProtection__KeyRingPath: ${DataProtection__KeyRingPath:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-}
      ForwardedHeaders__KnownProxies__0: ${ForwardedHeaders__KnownProxies__0:-}
      GoogleAuth__Enabled: ${GoogleAuth__Enabled:-false}
      GoogleAuth__AllowedClientIds__0: ${GoogleAuth__AllowedClientIds__0:-}
      TwoFactor__Issuer: ${TwoFactor__Issuer:-WorkspaceEcommerce}
      TwoFactor__SetupLifetimeMinutes: ${TwoFactor__SetupLifetimeMinutes:-10}
      TwoFactor__ChallengeLifetimeMinutes: ${TwoFactor__ChallengeLifetimeMinutes:-5}
      TwoFactor__RecoveryCodeCount: ${TwoFactor__RecoveryCodeCount:-10}
      EmailDelivery__Provider: ${EmailDelivery__Provider:-Log}
      EmailDelivery__SenderEmail: ${EmailDelivery__SenderEmail:-}
      EmailDelivery__Host: ${EmailDelivery__Host:-}
      EmailDelivery__Port: ${EmailDelivery__Port:-587}
      EmailDelivery__EnableSsl: ${EmailDelivery__EnableSsl:-true}
      EmailDelivery__UserName: ${EmailDelivery__UserName:-}
      EmailDelivery__Password: ${EmailDelivery__Password:-}
      EmailDelivery__WorkerIntervalSeconds: ${EmailDelivery__WorkerIntervalSeconds:-30}
      MediaStorage__Provider: ${MediaStorage__Provider:-Local}
      MediaStorage__PublicBaseUrl: ${MediaStorage__PublicBaseUrl:-http://localhost:5080}
      MediaStorage__Bucket: ${MediaStorage__Bucket:-}
      MediaStorage__ServiceUrl: ${MediaStorage__ServiceUrl:-}
      MediaStorage__Region: ${MediaStorage__Region:-us-east-1}
      MediaStorage__AccessKey: ${MediaStorage__AccessKey:-}
      MediaStorage__SecretKey: ${MediaStorage__SecretKey:-}
      MediaStorage__ForcePathStyle: ${MediaStorage__ForcePathStyle:-true}
      MiniLogistics__BaseUrl: ${MiniLogistics__BaseUrl:-http://host.docker.internal:5221/api/v1/partner}
      MiniLogistics__ApiKey: ${MiniLogistics__ApiKey:?Set MiniLogistics__ApiKey in .env}
      MiniLogistics__WebhookSecret: ${MiniLogistics__WebhookSecret:?Set MiniLogistics__WebhookSecret in .env}
      MiniLogistics__WebhookToleranceSeconds: ${MiniLogistics__WebhookToleranceSeconds:-300}
      MiniLogistics__OperationTimeoutSeconds: ${MiniLogistics__OperationTimeoutSeconds:-10}
      MiniLogistics__MaxRetryAttempts: ${MiniLogistics__MaxRetryAttempts:-2}
      MiniLogistics__RetryBaseDelayMilliseconds: ${MiniLogistics__RetryBaseDelayMilliseconds:-250}
      MiniLogistics__CircuitBreakerFailureThreshold: ${MiniLogistics__CircuitBreakerFailureThreshold:-5}
      MiniLogistics__CircuitBreakerBreakSeconds: ${MiniLogistics__CircuitBreakerBreakSeconds:-30}
      MiniLogistics__CommandWorkerIntervalSeconds: ${MiniLogistics__CommandWorkerIntervalSeconds:-15}
      Storefront__BaseUrl: ${Storefront__BaseUrl:-http://localhost:5173}
      Payment__VNPay__TmnCode: ${Payment__VNPay__TmnCode:?Set Payment__VNPay__TmnCode in .env}
      Payment__VNPay__HashSecret: ${Payment__VNPay__HashSecret:?Set Payment__VNPay__HashSecret in .env}
      Payment__VNPay__PaymentUrl: ${Payment__VNPay__PaymentUrl:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      Payment__VNPay__ReturnUrl: ${Payment__VNPay__ReturnUrl:-http://localhost:5080/api/payments/vnpay/return}
      Payment__VNPay__IpnUrl: ${Payment__VNPay__IpnUrl:-http://localhost:5080/api/payments/vnpay/ipn}
      Payment__VNPay__Version: ${Payment__VNPay__Version:-2.1.0}
      Payment__VNPay__Command: ${Payment__VNPay__Command:-pay}
      Payment__VNPay__Locale: ${Payment__VNPay__Locale:-vn}
      Payment__VNPay__CurrCode: ${Payment__VNPay__CurrCode:-VND}
    ports:
      - "${API_PORT:-5080}:8080"
      - "${API_HTTPS_PORT:-5443}:8443"
    volumes:
      - ./.certs:/https:ro
      - media_data:/app/wwwroot/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: workspace-ecommerce-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: ["storage"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MediaStorage__Bucket: ${MediaStorage__Bucket:?Set MediaStorage__Bucket in .env}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MediaStorage__Bucket &&
      mc anonymous set download local/$$MediaStorage__Bucket"
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: src/WorkspaceEcommerce.Api/Dockerfile
      target: migrate
    image: workspace-ecommerce-api-migrate:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AdminAuth__Email: ${AdminAuth__Email:?Set AdminAuth__Email in .env}
      AdminAuth__Password: ${AdminAuth__Password:?Set AdminAuth__Password in .env}
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer in .env}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience in .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: src/WorkspaceEcommerce.Api/Dockerfile
      target: final
    image: workspace-ecommerce-api:local
    command: ["--seed-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AdminAuth__Email: ${AdminAuth__Email:?Set AdminAuth__Email in .env}
      AdminAuth__Password: ${AdminAuth__Password:?Set AdminAuth__Password in .env}
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer in .env}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience in .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  minio_data:
