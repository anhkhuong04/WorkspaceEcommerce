name: Secret hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-runtime-secret-scan:
    name: Scan tracked runtime configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on embedded runtime credentials
        shell: pwsh
        run: ./scripts/scan-tracked-runtime-secrets.ps1
