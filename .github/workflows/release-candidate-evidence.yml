name: Release candidate evidence

on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: Fully-qualified immutable image reference (for example ghcr.io/org/workspace-ecommerce@sha256:<digest>)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-candidate-evidence-${{ inputs.image_reference }}
  cancel-in-progress: false

jobs:
  verify-immutable-image:
    name: Verify and scan the supplied image digest
    runs-on: ubuntu-latest
    steps:
      - name: Reject mutable image references
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          if [[ ! "$IMAGE_REFERENCE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "image_reference must end with an immutable sha256 digest" >&2
            exit 1
          fi

      - name: Authenticate to GitHub Container Registry when applicable
        if: startsWith(inputs.image_reference, 'ghcr.io/')
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull the already-built release candidate
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          mkdir -p artifacts/release-candidate
          docker pull "$IMAGE_REFERENCE"
          docker image inspect "$IMAGE_REFERENCE" --format '{{json .RepoDigests}}' > artifacts/release-candidate/repo-digests.json
          docker image inspect "$IMAGE_REFERENCE" --format '{{.Id}}' > artifacts/release-candidate/local-image-id.txt

      - name: Scan the exact release candidate digest
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/artifacts/release-candidate:/reports"
          aquasec/trivy:0.58.2 image
          --severity HIGH,CRITICAL
          --exit-code 1
          --format json
          --output /reports/trivy.json
          "$IMAGE_REFERENCE"

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-candidate
          if-no-files-found: warn
          retention-days: 180
