name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=workspace_ecommerce_ci;Username=workspace_ecommerce;Password=ci-only-password
  AdminAuth__Email: ci-admin@example.test
  AdminAuth__Password: ci-only-admin-password
  Jwt__Issuer: WorkspaceEcommerce.CI
  Jwt__Audience: WorkspaceEcommerce.CI
  Jwt__SigningKey: ci-only-signing-key-that-is-long-enough-for-hs256
  Jwt__AccessTokenMinutes: 60

jobs:
  backend:
    name: Backend build, test, migration, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore pinned tools and packages
        run: |
          dotnet tool restore
          dotnet restore WorkspaceEcommerce.slnx --locked-mode

      - name: Build backend
        run: dotnet build WorkspaceEcommerce.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: >-
          dotnet test WorkspaceEcommerce.slnx --no-build --no-restore --configuration Release
          --logger "trx;LogFileName=backend.trx"
          --results-directory artifacts/backend/test-results

      - name: Verify EF model has a migration
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/WorkspaceEcommerce.Infrastructure
          --startup-project src/WorkspaceEcommerce.Api
          --context AppDbContext
          --configuration Release
          --no-build

      - name: Verify clean and upgrade migrations
        shell: pwsh
        run: ./scripts/verify-prh-009-migrations.ps1

      - name: Export and enforce NuGet vulnerability audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/backend | Out-Null
          dotnet list WorkspaceEcommerce.slnx package --vulnerable --include-transitive --format json |
            Set-Content artifacts/backend/nuget-vulnerabilities.json -Encoding utf8
          ./scripts/assert-no-nuget-vulnerabilities.ps1 -ReportPath artifacts/backend/nuget-vulnerabilities.json

      - name: Export backend CycloneDX SBOM
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          -v "$PWD/artifacts/backend:/reports"
          anchore/syft:v1.20.0 dir:/workspace
          -o cyclonedx-json=/reports/backend-sbom.cdx.json

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/backend
          if-no-files-found: warn
          retention-days: 90

  frontend:
    name: Frontend locked build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Export production license inventory
        run: |
          mkdir -p ../artifacts/frontend
          pnpm licenses list --prod --json > ../artifacts/frontend/production-licenses.json

      - name: Export frontend CycloneDX SBOM
        run: >-
          docker run --rm
          -v "$PWD/..:/workspace:ro"
          -v "$PWD/../artifacts/frontend:/reports"
          anchore/syft:v1.20.0 dir:/workspace/frontend
          -o cyclonedx-json=/reports/frontend-sbom.cdx.json

      - name: Enforce production dependency audit
        run: |
          set +e
          pnpm audit --prod --audit-level=high --json > ../artifacts/frontend/pnpm-audit.json
          status=$?
          exit $status

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/frontend
          if-no-files-found: warn
          retention-days: 90

  browser-e2e:
    name: Isolated storefront browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run isolated storefront browser smoke
        shell: pwsh
        run: ./scripts/run-prh-015-storefront-e2e.ps1

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/frontend/e2e
          if-no-files-found: warn
          retention-days: 90

  container:
    name: Container build, migration smoke, and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build final and migration images
        run: |
          docker build --file src/WorkspaceEcommerce.Api/Dockerfile --target final --tag workspace-ecommerce-api:ci .
          docker build --file src/WorkspaceEcommerce.Api/Dockerfile --target migrate --tag workspace-ecommerce-api-migrate:ci .
          mkdir -p artifacts/container
          docker image inspect workspace-ecommerce-api:ci --format '{{json .RepoDigests}}' > artifacts/container/image-repo-digests.json
          docker image inspect workspace-ecommerce-api:ci --format '{{.Id}}' > artifacts/container/image-id.txt

      - name: Verify migration job and live/ready probes
        shell: pwsh
        run: ./scripts/verify-prh-010-container.ps1 -ArtifactsDirectory artifacts/container

      - name: Scan final image for high and critical findings
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/artifacts/container:/reports"
          aquasec/trivy:0.58.2 image
          --severity HIGH,CRITICAL
          --exit-code 1
          --format json
          --output /reports/trivy.json
          workspace-ecommerce-api:ci

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/container
          if-no-files-found: warn
          retention-days: 90
